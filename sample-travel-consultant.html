  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 src: url(\"a60e1859-1635-4d92-8d9d-a3e0f8f4e618\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Libre Baskerville';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c53903e7-7904-4448-924d-d7c48ed95447\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Libre Baskerville';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"34daf629-7fb9-4ae7-ac9e-7a9d1d1e066e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Libre Baskerville';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d1ea065a-5487-4a94-943f-0c2558bda83b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Libre Baskerville';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"34daf629-7fb9-4ae7-ac9e-7a9d1d1e066e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Libre Baskerville';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d1ea065a-5487-4a94-943f-0c2558bda83b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Special Elite';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c0506ed8-8c46-473e-a8e8-11a6a3bd3fc0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Special Elite';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"40f74180-5621-4852-bf80-1c5e5a95c9f9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*{box-sizing:border-box}\nbody{margin:0;background:#ece0c8;font-family:'Libre Baskerville',Georgia,serif;color:#2b2013;overflow-x:hidden}\na{color:#b5432f}\na:hover{color:#8f3324}\n::selection{background:#d9a441}\n@keyframes stampIn{0%{opacity:0;transform:scale(1.4) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}\n@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:fixed;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:multiply;background-image:url('data:image/svg+xml;utf8,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22&gt;&lt;filter id=%22n%22&gt;&lt;feTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.9%22 sc-camel-num-octaves=%222%22/&gt;&lt;/filter&gt;&lt;rect width=%22120%22 height=%22120%22 filter=%22url(%23n)%22/&gt;&lt;/svg&gt;');z-index:999;overflow:hidden\"><\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:{{ shellDirection }};min-height:100vh\">\n  <aside style=\"width:{{ sidebarWidth }};flex:none;background:#2b2013;color:#ece0c8;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:20px;padding:{{ sidebarPadding }};position:{{ sidebarPosition }};top:0;height:{{ sidebarHeight }}\">\n    <div style=\"position:relative;width:120px;height:120px\">\n      <div style=\"position:absolute;top:-8px;left:-8px;width:34px;height:14px;background:#d9a441;opacity:.85;transform:rotate(-35deg);z-index:2\"><\u002Fdiv>\n      <div style=\"position:absolute;top:-8px;right:-8px;width:34px;height:14px;background:#d9a441;opacity:.85;transform:rotate(35deg);z-index:2\"><\u002Fdiv>\n      <div style=\"width:120px;height:120px;border-radius:4px;overflow:hidden;border:6px solid #ece0c8;box-shadow:0 4px 0 rgba(0,0,0,.3);background:#ece0c8;display:flex;align-items:center;justify-content:center\">\n        <svg sc-camel-view-box=\"0 0 100 100\" width=\"76\" height=\"76\">\n          <circle cx=\"50\" cy=\"30\" r=\"16\" fill=\"none\" stroke=\"#2b2013\" stroke-width=\"3\"><\u002Fcircle>\n          <path d=\"M20,95 Q20,55 50,55 Q80,55 80,95\" fill=\"none\" stroke=\"#2b2013\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:center\">\n      <div style=\"font-family:'Special Elite',monospace;font-size:22px;letter-spacing:.01em\">Your Name<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#d9a441;margin-top:6px;letter-spacing:.05em\">travel consultant<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;line-height:1.7;text-align:center;color:rgba(236,224,200,.75);margin:0;max-width:210px;font-family:'IBM Plex Mono',monospace\">I plan trips for people who want the good parts without doing the research themselves.<\u002Fp>\n    <svg sc-camel-view-box=\"0 0 60 60\" width=\"40\" height=\"40\" style=\"opacity:.8\">\n      <circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"none\" stroke=\"#d9a441\" stroke-width=\"2\"><\u002Fcircle>\n      <g style=\"transform:rotate({{ compassRotation }}deg);transform-origin:30px 30px;transition:transform .25s ease-out\">\n        <path d=\"M30,10 L35,30 L30,50 L25,30 Z\" fill=\"#b5432f\"><\u002Fpath>\n      <\u002Fg>\n      <circle cx=\"30\" cy=\"30\" r=\"2.5\" fill=\"#ece0c8\"><\u002Fcircle>\n    <\u002Fsvg>\n    <a href=\"#newsletter\" style=\"border:2px dashed #d9a441;color:#d9a441;font-family:'Special Elite',monospace;font-size:12px;text-decoration:none;padding:10px 18px;border-radius:2px;transform:rotate(-1deg)\">Get My Newsletter<\u002Fa>\n  <\u002Faside>\n\n  <main style=\"flex:1;min-width:0;padding:{{ mainPadding }};display:flex;flex-direction:column;gap:{{ sectionGap }}\">\n\n    <section style=\"position:relative;max-width:640px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b5432f;letter-spacing:.08em;margin-bottom:14px\">// THE PROBLEM<\u002Fdiv>\n      <h1 style=\"font-family:'Special Elite',monospace;font-size:clamp(30px,4.2vw,46px);line-height:1.25;margin:0 0 20px;transform:rotate(-0.4deg)\">You want a great trip.<br>Planning it is the hard part.<\u002Fh1>\n      <p style=\"font-size:17px;line-height:1.75;color:rgba(43,32,19,.8);margin:0\">Endless tabs, conflicting reviews, and a trip you're not sure you'll actually enjoy once you land. I plan the whole thing around how you actually like to travel, so you just show up.<\u002Fp>\n      <div ref=\"{{ heroLineRef }}\" style=\"height:2px;background:repeating-linear-gradient(90deg,#2b2013 0 8px,transparent 8px 14px);margin-top:32px;transform:{{ heroLineTransform }}\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-observe=\"quotes\" ref=\"{{ quotesRef }}\" style=\"display:flex;flex-direction:column;gap:24px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b5432f;letter-spacing:.08em;margin-bottom:8px\">// WHAT PEOPLE SAY<\u002Fdiv>\n        <p style=\"font-size:15px;line-height:1.7;color:rgba(43,32,19,.75);margin:0;max-width:480px\">You don't have to take my word for it. Here's what past trips have felt like from the other side.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"overflow:hidden;margin:0 -56px;padding:4px 0\" sc-camel-on-mouse-enter=\"{{ pauseMarquee }}\" sc-camel-on-mouse-leave=\"{{ resumeMarquee }}\">\n      <div ref=\"{{ marqueeRef }}\" style=\"display:flex;gap:20px;width:max-content;padding:0 56px;animation:marquee 30s linear infinite\">\n        <sc-for list=\"{{ testimonialsLoop }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <div style=\"width:260px;flex:none;background:#fdf8ec;border:1px solid rgba(43,32,19,.2);padding:20px 22px;transform:rotate({{ t.tilt }}deg);opacity:{{ t.opacity }};transition:opacity .6s ease {{ t.delay }}s,transform .6s ease {{ t.delay }}s;box-shadow:3px 3px 0 rgba(43,32,19,.15);position:relative\">\n            <div style=\"position:absolute;top:8px;right:10px;font-family:'Special Elite',monospace;font-size:9px;color:rgba(43,32,19,.3)\">#{{ t.num }}<\u002Fdiv>\n            <sc-if value=\"{{ t.video }}\" hint-placeholder-val=\"{{ false }}\">\n              <sc-if value=\"{{ t.videoField.hasEmbed }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;aspect-ratio:16/9;border-radius:2px;overflow:hidden;border:1px solid rgba(43,32,19,.3);margin-bottom:12px\">\n                  <iframe src=\"{{ t.videoField.embedUrl }}\" style=\"width:100%;height:100%;border:none\" allowfullscreen=\"true\"><\u002Fiframe>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ t.videoField.noEmbed }}\" hint-placeholder-val=\"{{ true }}\">\n                <div sc-camel-on-click=\"{{ openVideoModal }}\" style=\"width:100%;aspect-ratio:16/9;border-radius:2px;border:1px dashed rgba(43,32,19,.4);margin-bottom:12px;background:rgba(43,32,19,.05);display:flex;align-items:center;justify-content:center;cursor:pointer\">\n                  <div style=\"width:40px;height:40px;border-radius:50%;background:rgba(43,32,19,.75);display:flex;align-items:center;justify-content:center\">\n                    <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"#ece0c8\"><path d=\"M5 3l16 9-16 9V3z\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ t.quote }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-family:'Special Elite',monospace;font-size:15px;line-height:1.6;margin-bottom:12px\">“{{ t.quote }}”<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(43,32,19,.55)\">— {{ t.author }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-direction:column;gap:20px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b5432f;letter-spacing:.08em;margin-bottom:8px\">// HOW I CAN HELP<\u002Fdiv>\n        <p style=\"font-size:15px;line-height:1.7;color:rgba(43,32,19,.75);margin:0;max-width:480px\">Whatever kind of trip you're picturing, there's a way to make it easy. Tap into any of these.<\u002Fp>\n      <\u002Fdiv>\n      <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid rgba(43,32,19,.25);background:#fdf8ec\">\n          <button sc-camel-on-click=\"{{ p.toggle }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;background:none;border:none;cursor:pointer;text-align:left;font-family:'Special Elite',monospace;font-size:17px;color:#2b2013\">\n            <span style=\"display:flex;align-items:center;gap:12px\">{{ p.name }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:18px;transform:{{ p.iconTransform }};transition:transform .3s\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"max-height:{{ p.maxHeight }};overflow:hidden;transition:max-height .35s ease\">\n            <div style=\"padding:0 22px 22px;display:flex;flex-direction:column;gap:12px\">\n              <p style=\"font-size:14px;line-height:1.7;color:rgba(43,32,19,.75);margin:0\">{{ p.blurb }}<\u002Fp>\n              <a href=\"{{ p.href }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b5432f;text-decoration:none;border-bottom:1px dashed #b5432f;width:fit-content\">check it out →<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-direction:column;gap:20px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b5432f;letter-spacing:.08em;margin-bottom:8px\">// THE PLAN<\u002Fdiv>\n        <p style=\"font-size:15px;line-height:1.7;color:rgba(43,32,19,.75);margin:0;max-width:480px\">No guesswork, no fifty open tabs. Here's exactly what happens once you reach out.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:0\">\n        <sc-for list=\"{{ planSteps }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:18px;padding:16px 0;border-bottom:1px dashed rgba(43,32,19,.3);align-items:flex-start\">\n            <div style=\"font-family:'Special Elite',monospace;font-size:22px;color:#d9a441;flex:none;width:34px\">{{ s.num }}<\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Special Elite',monospace;font-size:16px;margin-bottom:4px\">{{ s.title }}<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.6;color:rgba(43,32,19,.75)\">{{ s.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"newsletter\" style=\"background:#2b2013;color:#ece0c8;padding:44px 40px;position:relative;overflow:hidden;transform:rotate(-0.3deg)\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d9a441;letter-spacing:.08em;margin-bottom:12px\">// DON'T MISS WHAT'S NEXT<\u002Fdiv>\n      <h2 style=\"font-family:'Special Elite',monospace;font-size:26px;margin:0 0 20px;max-width:420px\">Get trip ideas and travel notes, straight to your inbox.<\u002Fh2>\n      <sc-if value=\"{{ vslField.hasEmbed }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"width:100%;max-width:480px;aspect-ratio:16/9;border-radius:4px;overflow:hidden;border:2px solid #d9a441;margin-bottom:20px\">\n          <iframe src=\"{{ vslField.embedUrl }}\" style=\"width:100%;height:100%;border:none\" allowfullscreen=\"true\"><\u002Fiframe>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ vslField.noEmbed }}\" hint-placeholder-val=\"{{ true }}\">\n        <div sc-camel-on-click=\"{{ openVideoModal }}\" style=\"width:100%;max-width:480px;aspect-ratio:16/9;border-radius:4px;border:1px dashed rgba(217,164,65,.6);margin-bottom:20px;background:rgba(217,164,65,.06);display:flex;align-items:center;justify-content:center;cursor:pointer\">\n          <div style=\"width:56px;height:56px;border-radius:50%;background:rgba(236,224,200,.15);display:flex;align-items:center;justify-content:center\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"#d9a441\"><path d=\"M5 3l16 9-16 9V3z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;max-width:560px\">\n        <input type=\"text\" placeholder=\"Your name\" style=\"flex:1;min-width:140px;background:#ece0c8;border:1px solid rgba(236,224,200,.4);color:#2b2013;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:12px 14px\">\n        <input type=\"email\" placeholder=\"Your email\" style=\"flex:1.4;min-width:180px;background:#ece0c8;border:1px solid rgba(236,224,200,.4);color:#2b2013;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:12px 14px\">\n        <a href=\"mailto:hello@example.com?subject=Newsletter\" style=\"display:inline-block;flex:none;background:#d9a441;color:#2b2013;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;text-decoration:none;padding:12px 24px;white-space:nowrap\">Sign me up →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(43,32,19,.5);padding-top:8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px\">\n      <div>© 2026 Your Name<\u002Fdiv>\n      <div style=\"display:flex;gap:14px;justify-content:center\"><a href=\"#\" style=\"color:inherit\">instagram<\u002Fa><a href=\"#\" style=\"color:inherit\">pinterest<\u002Fa><a href=\"#\" style=\"color:inherit\">linkedin<\u002Fa><\u002Fdiv>\n      <div style=\"text-align:right\">built with Shelly Sites<\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<sc-if value=\"{{ videoModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeVideoModal }}\" style=\"position:fixed;inset:0;background:rgba(43,32,19,.75);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px\">\n    <div sc-camel-on-click=\"{{ stopPropagation }}\" style=\"width:100%;max-width:640px;aspect-ratio:16/9;background:#1a1410;border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center\">\n      <div style=\"width:64px;height:64px;border-radius:50%;background:rgba(236,224,200,.15);display:flex;align-items:center;justify-content:center\">\n        <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"#ece0c8\"><path d=\"M5 3l16 9-16 9V3z\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"position:absolute;bottom:16px;left:20px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(236,224,200,.5)\">sample video preview<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ closeVideoModal }}\" style=\"position:absolute;top:-40px;right:0;background:none;border:none;color:#ece0c8;font-size:24px;cursor:pointer;line-height:1\">×<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { open: null, quotesRevealed: false, scrollY: 0, isMobile: typeof window !== 'undefined' && window.innerWidth < 880, activeVideo: false };\n  videoUrls = { 'testi-video-1': '', 'testi-video-2': '', 'vsl-video': '' };\n  marqueeRef = React.createRef();\n  pauseMarquee = () => { if (this.marqueeRef.current) this.marqueeRef.current.style.animationPlayState = 'paused'; };\n  resumeMarquee = () => { if (this.marqueeRef.current) this.marqueeRef.current.style.animationPlayState = 'running'; };\n\n  getYoutubeEmbed(url) {\n    if (!url) return null;\n    const m = url.match(/(?:youtube\\.com\\/(?:watch\\?v=|embed\\/|shorts\\/)|youtu\\.be\\/)([\\w-]{11})/);\n    return m ? `https://www.youtube.com/embed/${m[1]}` : null;\n  }\n\n  quotesData = [\n    { quote: \"Every detail was handled. I didn't open a single tab the whole trip.\", author: 'a client' },\n    { author: 'a client, on video', video: true, slotId: 'testi-video-1' },\n    { quote: \"She knew exactly which days to slow down and which to pack in more.\", author: 'a client' },\n    { author: 'a client, on video', video: true, slotId: 'testi-video-2' },\n    { quote: \"Worth it just for the restaurant picks alone.\", author: 'a client' }\n  ];\n\n  projectsData = [\n    { id: 'custom', name: 'Custom Itineraries', blurb: 'A full trip planned around how you actually like to travel, day by day.', href: 'Coaching Landing.dc.html' },\n    { id: 'group', name: 'Group & Family Trips', blurb: 'Coordinated travel for groups, so nobody is stuck planning for everyone.', href: 'Community Landing.dc.html' },\n    { id: 'guides', name: 'Destination Guides', blurb: 'Ready-made guides for popular destinations, built from real trips I have planned.', href: 'AI Builds Landing.dc.html' },\n    { id: 'work', name: 'Past Trips', blurb: 'Real itineraries and client trips, so you can see exactly how this plays out.', href: 'Selected Work Landing.dc.html' }\n  ];\n\n  planData = [\n    { num: '01', title: 'Book a call', desc: \"We talk through where you want to go and how you like to travel.\" },\n    { num: '02', title: 'Get your itinerary', desc: 'A day-by-day plan built around your budget, pace, and interests.' },\n    { num: '03', title: 'Travel with support', desc: \"I'm reachable while you're on the trip if anything needs to change.\" }\n  ];\n\n  componentDidMount() {\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => { if (e.isIntersecting) this.setState({ quotesRevealed: true }); });\n    }, { threshold: 0.2 });\n    if (this.quotesEl) io.observe(this.quotesEl);\n    this._io = io;\n\n    this._onScroll = () => {\n      requestAnimationFrame(() => this.setState({ scrollY: window.scrollY }));\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n\n    this._onResize = () => this.setState({ isMobile: window.innerWidth < 880 });\n    window.addEventListener('resize', this._onResize);\n  }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    window.removeEventListener('scroll', this._onScroll);\n    window.removeEventListener('resize', this._onResize);\n  }\n\n  renderVals() {\n    const parallax = Math.min(this.state.scrollY * 0.08, 40);\n    const testimonials = this.quotesData.map((t, i) => ({\n      ...t,\n      tilt: [-1, 1.2, -0.6, 0.9, -1.4][i % 5],\n      num: String(i + 1).padStart(2, '0'),\n      opacity: this.state.quotesRevealed ? 1 : 0,\n      delay: (i * 0.08).toFixed(2),\n      videoField: { hasEmbed: !!this.getYoutubeEmbed(this.videoUrls[t.slotId]), noEmbed: !this.getYoutubeEmbed(this.videoUrls[t.slotId]), embedUrl: this.getYoutubeEmbed(this.videoUrls[t.slotId]) }\n    }));\n    const vslEmbed = this.getYoutubeEmbed(this.videoUrls['vsl-video']);\n    const vslField = { hasEmbed: !!vslEmbed, noEmbed: !vslEmbed, embedUrl: vslEmbed };\n\n    const projects = this.projectsData.map(p => ({\n      ...p,\n      maxHeight: this.state.open === p.id ? '200px' : '0px',\n      iconTransform: this.state.open === p.id ? 'rotate(45deg)' : 'rotate(0deg)',\n      toggle: () => this.setState(s => ({ open: s.open === p.id ? null : p.id }))\n    }));\n\n    const mobile = this.state.isMobile;\n    return {\n      testimonials,\n      testimonialsLoop: testimonials.concat(testimonials),\n      marqueeRef: this.marqueeRef,\n      pauseMarquee: this.pauseMarquee,\n      resumeMarquee: this.resumeMarquee,\n      vslField,\n      projects,\n      planSteps: this.planData,\n      videoModalOpen: this.state.activeVideo,\n      openVideoModal: () => this.setState({ activeVideo: true }),\n      closeVideoModal: () => this.setState({ activeVideo: false }),\n      stopPropagation: (e) => e.stopPropagation(),\n      quotesRef: (el) => { this.quotesEl = el; },\n      heroLineRef: () => {},\n      heroLineTransform: `scaleX(${Math.min(1, 0.4 + this.state.scrollY / 300)})`,\n      compassRotation: Math.min(this.state.scrollY * 0.6, 360),\n      shellDirection: mobile ? 'column' : 'row',\n      sidebarWidth: mobile ? '100%' : '280px',\n      sidebarPadding: mobile ? '36px 24px' : '56px 24px 40px',\n      sidebarPosition: mobile ? 'relative' : 'sticky',\n      sidebarHeight: mobile ? 'auto' : '100vh',\n      mainPadding: mobile ? '40px 24px 20px' : '64px 56px',\n      sectionGap: mobile ? '48px' : '80px'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
