.week p{font-size:15px}
.panel{background:var(--ink);color:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--coral);padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.panel .eyebrow{color:var(--gold)}
.panel h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05}
.panel p{color:#E2D4BF}
footer{border-top:2px solid var(--ink);padding-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

<script>
(function(){
  var KEY='next5-checklist-v2';
  var VIDEO='https://www.youtube.com/embed/awoq60imi6w';
  var JOIN='https://www.skool.com/clients/about';

  var sections=[
    {title:'Get Clear',c:'var(--gold)',tip:'When you can explain who you help in one sentence, people can say yes or pass you along.',items:[
      {id:'c1',text:'I can say who I help in one sentence',sentence:true},
      {id:'c2',text:'I know the main problem I solve for them',prompt:'The problem'},
      {id:'c3',text:'I have one clear starter offer',prompt:'My offer'},
      {id:'c4',text:"I've set a price I feel confident sharing",prompt:'My price ($)'}
    ]},
    {title:'Get Set Up',c:'var(--blue)',cf:'#FFFCF6',tip:'Pick one place to show up and make the next step easy. You can add more platforms later.',items:[
      {id:'s1',text:"I've picked one platform where my ideal clients hang out",prompt:'My platform'},
      {id:'s2',text:'My profile says who I help and how to reach me',prompt:'My profile headline'},
      {id:'s3',text:"I've decided how people will learn about my offer and start working with me",choice:true},
      {id:'s4',text:'I have a simple way to book calls or share my offer doc',prompt:'My link'}
    ]},
    {title:'Get Visible',c:'var(--coral)',tip:'Your next clients often come from people who already know you (and past clients, if you have them). Start there.',items:[
      {id:'v1',text:"I've mapped out a 30-day content plan (what I'll post and which days)",prompt:'My posting days'},
      {id:'v2',text:"I've posted 3 times this past week about my ideal client's problem",prompt:'My post topics'},
      {id:'v3',text:'I have a list of 20 people I already know to reach out to',names:true},
      {id:'v4',text:"I've started at least 5 real conversations",prompt:'How many so far'}
    ]},
    {title:'Get Clients',c:'var(--sage)',tip:'Some people love a conversation and some would rather read the details on their own time. Fill in the path you picked.',paths:{
      call:{label:'If you use calls',items:[
        {id:'k1',text:'I know what to ask on a discovery call',prompt:'Where my call questions are saved'},
        {id:'k2',text:'I know how to make the invite at the end',prompt:'Where my invite script is saved'}
      ]},
      doc:{label:'If you use an offer doc',items:[
        {id:'d1',text:"My offer doc covers who it's for, what's included, the price, and how to join",prompt:'Where it lives'},
        {id:'d2',text:"I know when to send it (after they've shared what they need)",prompt:"I'll send it when"},
        {id:'d3',text:'I have a simple follow-up message ready',prompt:'Where my follow-up message is saved'}
      ]}
    },items:[
      {id:'e1',text:"I'm tracking my conversations and who I've sent offers to",prompt:'Where I track them'},
      {id:'e2',text:"I've picked a date to make my next offer",prompt:'My date'}
    ]}
  ];

  var state={step:0,checks:{},answers:{},path:'',name:'',email:'',unlocked:false,bonusOpen:false};
  try{var saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved)state=Object.assign(state,saved);}catch(e){}
  if(!state.unlocked)state.step=0;
  else if(state.step===0)state.step=1;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var app=document.getElementById('app');

  function header(){
    return '<header><p class="eyebrow">Mona Weathers Coaching · Free checklist</p>'
      +'<h1>Your Next <span>5 Clients</span>: What to Do in the Next 30 Days</h1>'
      +'<p class="sub">For coaches and consultants who are just getting started or have landed their first clients and want more</p></header>';
  }

  function progress(){
    var pct=Math.round(state.step/5*100);
    var c=state.step>=1&&state.step<=4?sections[state.step-1].c:'var(--sage)';
    var label=state.step<=4?'Section '+state.step+' of 4':'Your results';
    return '<div class="progress"><div class="top"><span class="eyebrow">Your Next 5 Clients</span><span class="mono">'+label+'</span></div>'
      +'<div class="track" role="progressbar" aria-label="Checklist progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><div class="fill" style="width:'+pct+'%;--c:'+c+'"></div></div></div>';
  }

  function itemHTML(it,c){
    var h='<div class="item"><label class="check" style="--c:'+c+'"><input type="checkbox" id="chk-'+it.id+'" data-check="'+it.id+'"'+(state.checks[it.id]?' checked':'')+'><span>'+esc(it.text)+'</span></label>';
    if(it.sentence){
      h+='<div class="answer"><div class="sentence">'
        +'<label for="ans-c1a">I help</label><input type="text" id="ans-c1a" data-ans="c1a" placeholder="who you help" value="'+esc(state.answers.c1a)+'">'
        +'<label for="ans-c1b">who</label><input type="text" id="ans-c1b" data-ans="c1b" placeholder="what they struggle with" value="'+esc(state.answers.c1b)+'">'
        +'<label for="ans-c1c">so they can</label><input type="text" id="ans-c1c" data-ans="c1c" placeholder="the result they want" value="'+esc(state.answers.c1c)+'">'

    if(q('open-bonus'))q('open-bonus').onclick=openBonus;
    if(q('open-bonus-s1'))q('open-bonus-s1').onclick=openBonus;
    if(q('back'))q('back').onclick=function(){go(state.step-1);};
    if(q('next'))q('next').onclick=function(){go(state.step+1);};
    if(q('edit'))q('edit').onclick=function(){go(1);};
    if(q('dl'))q('dl').onclick=downloadPDF;
    app.querySelectorAll('[data-check]').forEach(function(el){el.onchange=function(){state.checks[el.dataset.check]=el.checked;save();};});
    app.querySelectorAll('[data-ans]').forEach(function(el){el.oninput=function(){state.answers[el.dataset.ans]=el.value;save();};});
    app.querySelectorAll('input[name=path]').forEach(function(el){el.onchange=function(){state.path=el.value;save();};});
    var vw=app.querySelector('.video-wrap');
    var modal=document.getElementById('videoModal');
    var vclose=document.getElementById('videoClose');
    if(vw&&modal){
      vw.onclick=function(){
        if(VIDEO.indexOf('[')<0){
          var embed=modal.querySelector('.video-modal-embed');
          if(!embed.querySelector('iframe')){
            var ifr=document.createElement('iframe');
            ifr.src=VIDEO+'?autoplay=1&rel=0';
            ifr.allow='autoplay; fullscreen';
            ifr.allowFullscreen=true;
            ifr.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0';
            embed.appendChild(ifr);
          }
        }
        modal.classList.add('open');
      };
      function closeModal(){
        modal.classList.remove('open');
        var ifr=modal.querySelector('iframe');
        if(ifr)ifr.remove();
      }
      vclose.onclick=closeModal;
      modal.onclick=function(e){if(e.target===modal)closeModal();};
    }
    var fdEl=q('fd-form-6adfde19da09fd14dc782189');
    if(fdEl&&window.fd){
      window.fd('form',{formId:'6adfde19da09fd14dc782189',containerEl:'#fd-form-6adfde19da09fd14dc782189'});
      fdEl.addEventListener('submit',function(){
        state.unlocked=true;save();
        setTimeout(function(){go(1);},600);
      },true);
    }
  }

  render();
})();
</script>
</body>
</html>
