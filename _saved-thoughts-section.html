    <!-- THOUGHTS FOR TODAY -->
    <style>
  .tft {
    --tft-cream:     #FAF3EA;
    --tft-card:      #FFFCF6;
    --tft-border:    #DDD6C7;
    --tft-rule:      #E6E0D2;
    --tft-ink:       #1B1A17;
    --tft-body:      #55503F;
    --tft-muted:     #8A8578;
    --tft-coral:     #E8604C;
    --tft-coral-ink: #9E3820;
    --tft-display:   'Hanken Grotesk', system-ui, sans-serif;
    --tft-mono:      'JetBrains Mono', ui-monospace, monospace;
    background: var(--tft-cream);
    padding: 56px 24px 72px;
  }
  .tft-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .tft-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .tft-label { font-family: var(--tft-mono); font-size: 13px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--tft-coral-ink); }
  .tft-status { display: flex; align-items: center; gap: 8px; background: rgba(232,96,76,.12); border-radius: 999px; padding: 6px 12px; font-family: var(--tft-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tft-coral-ink); }
  .tft-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tft-coral); }
  .tft-card { background: var(--tft-card); border: 1px solid var(--tft-border); border-radius: 22px; padding: 34px 38px; display: flex; gap: 22px; align-items: flex-start; box-shadow: 5px 5px 0 var(--ink); }
  .tft-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; object-position: 50% 26%; flex: none; background: var(--tft-border); }
  .tft-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .tft-meta { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .tft-name { font-family: var(--tft-display); font-size: 18px; font-weight: 700; color: var(--tft-ink); }
  .tft-handle { font-family: var(--tft-mono); font-size: 12px; color: var(--tft-muted); }
  .tft-lead { margin: 0; font-family: var(--tft-display); font-size: 23px; line-height: 1.45; color: var(--tft-ink); text-wrap: pretty; }
  .tft-note { margin: 0; font-family: var(--tft-display); font-size: 16px; line-height: 1.65; color: var(--tft-body); text-wrap: pretty; }
  .tft-foot { border-top: 1px solid var(--tft-rule); padding-top: 14px; font-family: var(--tft-mono); font-size: 12px; color: var(--tft-muted); }
  @media (max-width: 640px) {
    .tft { padding: 36px 16px 48px; }
    .tft-card { padding: 22px; gap: 0; flex-direction: column; }
    .tft-card .tft-avatar { width: 44px; height: 44px; }
    .tft-mobile-row { display: flex; gap: 12px; align-items: center; }
    .tft-lead { font-size: 19px; }
    .tft-note { font-size: 15px; }
  }
    </style>

    <section class="tft" id="thoughts">
      <div class="tft-inner">
        <div class="tft-head">
          <div class="tft-label">Thoughts for Today</div>
          <div class="tft-status">From Mona's desk</div>
        </div>
        <div class="tft-card">
          <img class="tft-avatar" src="/mona-shelly-photo.png" alt="Mona Weathers" width="60" height="60">
          <div class="tft-body">
            <div class="tft-meta">
              <span class="tft-name">Mona Weathers</span>
              <span class="tft-handle">@monaweathers &middot; <time datetime="2026-09-25">25 Sep</time></span>
            </div>
            <p class="tft-lead">Get used to saying no to more so that there is room for more yeses.</p>
            <div class="tft-foot">New thought most mornings</div>
          </div>
        </div>
      </div>
    </section>
